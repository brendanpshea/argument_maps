id: social-media-ban
title: A social media ban for teens
description: >
  A three-step problem: map an argument, add new evidence, then add an
  objection and a reply. You find the claims yourself and may reword them.
claimMode: highlight

modelWording:
  s1: Lawmakers should ban social media accounts for people under sixteen.
  s2: Heavy social media use is linked to rising rates of anxiety and depression among teenagers.
  s3: Younger teenagers are less able than adults to limit their own time on social media.
  s5: A ban on teen social media accounts would be easy to evade, because teenagers can lie about their age.

steps:
  - title: The argument
    instructions: >
      Select the text of each claim in the passage (or use “Choose the words”)
      and press "Add claim". You can reword a claim (✎ on the map, or in the
      outline) so that it is clear
      on its own, e.g. replace pronouns with what they refer to. Mark the main
      conclusion and connect the premises to it.
    passage: |
      Lawmakers are debating whether to ban social media accounts for anyone under
      sixteen. I think {{s1|they should pass the ban}}. {{s2|Heavy social media use is
      linked to rising rates of anxiety and depression among teenagers}}, and
      {{s3|younger teens are less able than adults to regulate how much time they spend
      on these apps}}.
    answer:
      conclusion: s1
      relations:
        # Reading these premises as linked or as independent reasons is defensible.
        - { type: support, from: [s2, s3], to: s1, grouping: either }

  - title: New evidence
    instructions: >
      A newspaper reports a new study. Add it to your map. Which claim does it
      support?
    passage: |
      A follow-up report adds that {{s4|in one large study, teens who took a month-long
      break from social media reported significantly better mood}}.
    answer:
      conclusion: s1
      relations:
        - { type: support, from: [s2, s3], to: s1, grouping: either }
        # The study is evidence for the premise, or (as a test of cause) a direct reason for the ban.
        - { type: support, from: [s4], to: [s2, s1] }

  - title: Objection and reply
    instructions: >
      Critics respond, and the author replies. Add the objection and the
      rebuttal to your map.
    passage: |
      Critics respond that {{s5|a ban would be easy to evade, since teens can simply lie
      about their age}}. However, {{s6|age verification technology now makes lying about
      one's age far harder than it used to be}}.
    answer:
      conclusion: s1
      relations:
        - { type: support, from: [s2, s3], to: s1, grouping: either }
        # The study is evidence for the premise, or (as a test of cause) a direct reason for the ban.
        - { type: support, from: [s4], to: [s2, s1] }
        - { type: objection, from: [s5], to: s1 }
        - { type: rebuttal, from: [s6], to: s5 }
    mistakes:
      - relation: { type: support, from: [s6], to: s1 }
        message: >
          Is the point about age verification a new reason for the ban, or is
          the author responding to something the critics said?
