id: autumn-leaves
title: Why do maple leaves change color?
description: >
  An explanation, not an argument: the passage isn't trying to convince you
  that leaves change color (you already know they do), but to explain why.
  Find what is being explained, then map what explains it.
kind: explanation
claimMode: marked

steps:
  - task: conclusion
    title: Find what is being explained
    instructions: >
      This passage is an explanation. The explanandum is the fact or event
      being explained; the explanans is what explains it. Which claim is the
      explanandum? Click it.
    passage: |
      {{d1|Every October, thousands of tourists drive through New England to see the
      foliage.}} What they come for is the fact that {{e|maple leaves turn red and orange
      in autumn}}.

      This happens because {{x1|as the days shorten, maple trees stop producing
      chlorophyll}}, and {{x2|chlorophyll is the pigment that makes leaves green}}. With the
      green gone, {{x3|yellow and orange pigments that were in the leaves all along become
      visible}}.

      The reds have a different source: {{x4|in autumn, maples produce new red pigments
      called anthocyanins}}. {{x5|They make the most anthocyanin when sunny days are
      followed by cool nights}}, {{d2|which is why some years are more colorful than
      others}}.
    conclusionHints:
      d1: >
        The tourists are background. What do they come to see, and what is the
        rest of the passage explaining about it?

  - title: Map the explanation
    instructions: >
      Add the claims that help explain the explanandum, then drag from each
      one to what it explains. Some claims only explain something together
      with another claim; link those as a pair.
    answer:
      explanandum: e
      relations:
        - { type: explains, from: [x3], to: e }
        - { type: explains, from: [x1, x2], to: x3 }
        - { type: explains, from: [x4], to: e }
        - { type: explains, from: [x5], to: x4 }
        - { type: explains, from: [d2], to: x5, optional: true }
    mistakes:
      - relation: { type: explains, from: [x1, x2], to: e }
        message: >
          The loss of chlorophyll doesn't make leaves orange by itself. What
          does losing the green reveal?
