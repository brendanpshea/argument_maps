id: autumn-leaves
title: Why do maple leaves change color?
description: >
  An explanation, not an argument: the passage isn't trying to convince you
  that leaves change color (you already know they do), but to explain why.
  Find what is being explained, then map what explains it.
kind: explanation
claimMode: marked

steps:
  - task: conclusion
    title: Find what is being explained
    instructions: >
      This passage is an explanation. The explanandum is the fact or event
      being explained; the explanans is what explains it. Which claim is the
      explanandum? Click it.
    passage: |
      {{d1|Every October, thousands of tourists drive through New England to see the
      foliage.}} What they come for is the fact that {{e|maple leaves turn yellow, orange,
      and red in autumn}}.

      The yellows and oranges come first. {{x1|As the days shorten, maple trees stop
      producing chlorophyll}}, and {{x2|chlorophyll is the green pigment that hides the
      other colors in a leaf}}. But {{x3|yellow and orange pigments are in the leaves all
      summer long}}. So {{y|once the green fades, the yellows and oranges show through}}.

      The reds have a different source: {{r|in autumn, maples make new red pigments
      called anthocyanins}}. {{r1|Maples make anthocyanin from sugar trapped in their
      leaves}}, and {{r2|sunny autumn days followed by cool nights leave sugar trapped in
      the leaves}}.
    conclusionHints:
      d1: >
        The tourists are background. What do they come to see, and what is the
        rest of the passage explaining about it?

  - title: Map the explanation
    instructions: >
      Add the claims that help explain the explanandum, then drag from each
      one to what it explains. Some claims explain something only in
      combination with others; link those together.
    answer:
      explanandum: e
      relations:
        - { type: explains, from: [y], to: e }
        - { type: explains, from: [x1, x2, x3], to: y }
        - { type: explains, from: [r], to: e }
        - { type: explains, from: [r1, r2], to: r }
    mistakes:
      - relation: { type: explains, from: [x1, x2, x3], to: e }
        message: >
          Those claims don't make leaves orange directly. Which claim says what
          happens once the green is gone?
      - relation: { type: explains, from: [x1, x2], to: y }
        message: >
          Losing the green only reveals yellow and orange if something was
          hidden underneath. Which claim says those pigments were there all along?
      - relation: { type: explains, from: [r1, r2], to: e }
        message: >
          The trapped sugar matters because of what maples make from it. Which
          claim says what that is?
